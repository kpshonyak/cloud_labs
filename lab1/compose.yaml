services:
  db:
    image: postgres:16.4
    environment:
      POSTGRES_DB: tracks
      POSTGRES_USER: tracks
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracks -d tracks"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./app
    environment:
      DATABASE_URL: postgres://tracks:${DB_PASSWORD}@db:5432/tracks?sslmode=disable
      PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
